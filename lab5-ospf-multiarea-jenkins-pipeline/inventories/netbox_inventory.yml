---
plugin: netbox.netbox.nb_inventory
api_endpoint: http://192.168.1.16:8000
token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
validate_certs: false
config_context: false

group_by:
  - sites
  - device_roles
  - platforms

query_filters:
  - site: lab5
  - status: active

compose:
  ansible_host: primary_ip4.address | ansible.utils.ipaddr('address')
