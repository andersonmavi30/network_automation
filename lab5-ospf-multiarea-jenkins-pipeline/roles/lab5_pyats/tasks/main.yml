---
- name: Verify NetBox token is available
  ansible.builtin.assert:
    that:
      - lookup('env', 'NETBOX_TOKEN') | length > 0
    fail_msg: "The NETBOX_TOKEN environment variable is not defined."
    success_msg: "The NETBOX_TOKEN environment variable is available."

- name: Ensure pyATS artifact directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../artifacts/pyats"
    state: directory
    mode: "0755"

- name: Run Lab 5 pyATS structured validation
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/lab5_pyats_validate.py"
      - "--netbox-url"
      - "http://192.168.1.16:8000"
      - "--site"
      - "lab5"
      - "--topology-file"
      - "{{ playbook_dir }}/../vars/lab5_topology.yml"
      - "--output-dir"
      - "{{ playbook_dir }}/../artifacts/pyats"
  environment:
    NETBOX_TOKEN: "{{ lookup('env', 'NETBOX_TOKEN') }}"
    PYATS_USERNAME: "{{ ansible_user }}"
    PYATS_PASSWORD: "{{ ansible_password }}"
    PYATS_SECRET: "{{ ansible_become_password }}"
  register: lab5_pyats_result
  changed_when: false
  failed_when: false
  no_log: true

- name: Display sanitized pyATS command result
  ansible.builtin.debug:
    msg:
      return_code: "{{ lab5_pyats_result.rc }}"
      stdout: "{{ lab5_pyats_result.stdout | default('No stdout output') }}"
      stderr: "{{ lab5_pyats_result.stderr | default('No stderr output') }}"

- name: Check whether pyATS validation summary exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../artifacts/pyats/pyats_summary.json"
  register: lab5_pyats_summary_stat

- name: Read pyATS validation summary
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../artifacts/pyats/pyats_summary.json"
  register: lab5_pyats_summary_file
  when:
    - lab5_pyats_summary_stat.stat.exists

- name: Parse pyATS validation summary
  ansible.builtin.set_fact:
    lab5_pyats_summary: >-
      {{
        lab5_pyats_summary_file.content
        | b64decode
        | from_json
      }}
  when:
    - lab5_pyats_summary_stat.stat.exists

- name: Display pyATS validation summary
  ansible.builtin.debug:
    var: lab5_pyats_summary
  when:
    - lab5_pyats_summary_stat.stat.exists

- name: Verify pyATS validation passed
  ansible.builtin.assert:
    that:
      - lab5_pyats_result.rc == 0
      - lab5_pyats_summary_stat.stat.exists
      - (lab5_pyats_summary | default({})).get('validation_passed', false) | bool
    fail_msg: >-
      Lab 5 pyATS validation failed.
      Return code: {{ lab5_pyats_result.rc }}.
      Failed devices:
      {{
        (lab5_pyats_summary | default({}))
        .get('failed_devices', ['Summary unavailable'])
        | join(', ')
      }}.
      Output: {{ lab5_pyats_result.stdout | default('No stdout output') }}.
      Error: {{ lab5_pyats_result.stderr | default('No stderr output') }}
    success_msg: "Lab 5 pyATS validation passed successfully."
