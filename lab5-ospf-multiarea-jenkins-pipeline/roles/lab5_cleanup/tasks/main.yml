---
- name: Build candidate Lab 5 link interface list
  ansible.builtin.set_fact:
    lab5_cleanup_candidate_interfaces: >-
      {{
        links
        | map(attribute='endpoints')
        | flatten
        | selectattr('device', 'equalto', inventory_hostname)
        | map(attribute='interface')
        | unique
        | list
      }}

- name: Exclude management interface from cleanup
  ansible.builtin.set_fact:
    lab5_cleanup_interfaces: >-
      {{
        lab5_cleanup_candidate_interfaces
        | reject('equalto', lab5_management_interface)
        | list
      }}

- name: Remove Lab 5 OSPF process
  cisco.ios.ios_config:
    lines:
      - "no router ospf {{ ospf.process_id }}"

- name: Check whether Loopback0 exists
  cisco.ios.ios_command:
    commands:
      - show ip interface brief | include Loopback0
  register: lab5_loopback0_check
  changed_when: false

- name: Remove Lab 5 Loopback0 when present
  cisco.ios.ios_config:
    lines:
      - no interface Loopback0
  when:
    - lab5_loopback0_check.stdout[0] | trim | length > 0

- name: Clean Lab 5 link interfaces
  cisco.ios.ios_config:
    parents:
      - "interface {{ item }}"
    lines:
      - no description
      - no ip address
      - shutdown
  loop: "{{ lab5_cleanup_interfaces }}"

- name: Save cleanup configuration
  cisco.ios.ios_config:
    save_when: modified
