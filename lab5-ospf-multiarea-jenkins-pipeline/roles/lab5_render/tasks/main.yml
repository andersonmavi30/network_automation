---
- name: Load Lab 5 topology intent
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../vars/lab5_topology.yml"
    name: lab5_topology

- name: Ensure rendered configs directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../artifacts/rendered"
    state: directory
    mode: "0755"

- name: Render IOS XE OSPF multi-area candidate configs
  ansible.builtin.template:
    src: ios_ospf_multiarea.j2
    dest: "{{ playbook_dir }}/../artifacts/rendered/{{ item.key }}.cfg"
    mode: "0644"
  loop: "{{ lab5_topology.devices | dict2items }}"
  vars:
    device_name: "{{ item.key }}"
    device_data: "{{ item.value }}"
