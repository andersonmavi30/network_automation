hostname R4
!
interface Loopback0
 description OSPF Router-ID
 ip address 4.4.4.4 255.255.255.255
 no shutdown
!
interface GigabitEthernet2
 description R2_R4 - OSPF area 10
 ip address 10.0.24.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet3
 description AREA_10_LAN - OSPF area 10
 ip address 10.10.40.254 255.255.255.0
 no shutdown
!
router ospf 10
 router-id 4.4.4.4
 passive-interface Loopback0
 network 4.4.4.4 0.0.0.0 area 10
 network 10.0.24.0 0.0.0.3 area 10
 network 10.10.40.0 0.0.0.255 area 10
