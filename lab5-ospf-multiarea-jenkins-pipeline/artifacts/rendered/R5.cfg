hostname R5
!
interface Loopback0
 description OSPF Router-ID
 ip address 5.5.5.5 255.255.255.255
 no shutdown
!
interface GigabitEthernet2
 description R3_R5 - OSPF area 20
 ip address 10.0.35.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet3
 description AREA_20_LAN - OSPF area 20
 ip address 10.10.50.254 255.255.255.0
 no shutdown
!
router ospf 10
 router-id 5.5.5.5
 passive-interface Loopback0
 network 5.5.5.5 0.0.0.0 area 20
 network 10.0.35.0 0.0.0.3 area 20
 network 10.10.50.0 0.0.0.255 area 20
