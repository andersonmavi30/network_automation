---
- name: Lab 4 - Collect router evidence
  hosts: device_roles_router
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_user: netdevops
    ansible_password: "{{ lookup('env', 'IOS_PASSWORD') }}"
    ansible_network_cli_ssh_type: libssh
    ansible_libssh_hostkeys: ssh-rsa
    ansible_libssh_key_exchange_algorithms: "+diffie-hellman-group-exchange-sha1,+diffie-hellman-group14-sha1,+diffie-hellman-group1-sha1"
    ansible_libssh_publickey_algorithms: "+ssh-rsa"

  tasks:
    - name: Collect router operational evidence
      cisco.ios.ios_command:
        commands:
          - show version
          - show ip interface brief
          - show interfaces description
          - show ip ospf neighbor
          - show ip route ospf
          - show ip protocols
          - show running-config | section router ospf
          - show running-config | include hostname|router ospf|router-id|ip ospf|no passive-interface|passive-interface
      register: router_collect

    - name: Save router collected evidence
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../artifacts/collect/{{ inventory_hostname }}_collect.txt"
        content: |
          # Collect Evidence - {{ inventory_hostname }}

          {% for output in router_collect.stdout %}
          {{ output }}

          ---
          {% endfor %}
      delegate_to: localhost

- name: Lab 4 - Collect access switch evidence
  hosts: device_roles_access_switch
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_user: netdevops
    ansible_password: "{{ lookup('env', 'IOS_PASSWORD') }}"
    ansible_network_cli_ssh_type: libssh
    ansible_libssh_hostkeys: ssh-rsa
    ansible_libssh_key_exchange_algorithms: "+diffie-hellman-group-exchange-sha1,+diffie-hellman-group14-sha1,+diffie-hellman-group1-sha1"
    ansible_libssh_publickey_algorithms: "+ssh-rsa"

  tasks:
    - name: Collect access switch operational evidence
      cisco.ios.ios_command:
        commands:
          - show version
          - show vlan brief
          - show interfaces status
          - show interfaces description
          - show spanning-tree summary
          - show running-config interface GigabitEthernet0/1
          - show running-config interface GigabitEthernet0/2
      register: switch_collect

    - name: Save access switch collected evidence
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../artifacts/collect/{{ inventory_hostname }}_collect.txt"
        content: |
          # Collect Evidence - {{ inventory_hostname }}

          {% for output in switch_collect.stdout %}
          {{ output }}

          ---
          {% endfor %}
      delegate_to: localhost
