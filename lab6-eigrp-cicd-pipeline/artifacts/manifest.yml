---
lab:
  id: "lab6"
  name: "EIGRP CI/CD Pipeline"
  protocol: "EIGRP"
  process: "LAB6"
  autonomous_system: 100

artifact_strategy:
  repository:
    description: "Static and versioned evidence stored in Git."
  awx:
    description: "Runtime evidence generated by AWX Execution Environments."
  jenkins:
    description: "Final pipeline summary generated from AWX job results."

stages:
  precheck:
    order: 1
    source: "repository"
    path: "artifacts/precheck"
    expected:
      - "R1.json"
      - "R2.json"
      - "R3.json"
      - "R4.json"
      - "R5.json"
      - "R6.json"

  backup:
    order: 2
    source: "awx"
    expected_summary: "backup_summary.json"

  batfish:
    order: 3
    source: "awx"
    expected_summary: "batfish_summary.json"

  deploy:
    order: 4
    source: "awx"
    expected_status: true

  convergence:
    order: 5
    source: "awx"
    expected_summary: "convergence_summary.json"

  postcheck:
    order: 6
    source: "awx"
    expected_summary: "postcheck_summary.json"

  nornir:
    order: 7
    source: "awx"
    expected_summary: "nornir_summary.json"

  pyats:
    order: 8
    source: "awx"
    expected_summary: "pyats_summary.json"

  netconf:
    order: 9
    source: "awx"
    expected_summary: "netconf_summary.json"

  restconf:
    order: 10
    source: "awx"
    expected_summary: "restconf_summary.json"

  failover:
    order: 11
    source: "awx"
    expected_status: true

  reconvergence:
    order: 12
    source: "awx"
    expected_status: true

  rollback:
    order: 13
    source: "awx"
    expected_status: true

  rollback_idempotency:
    order: 14
    source: "awx"
    expected_status: true

  final_validation:
    order: 15
    source: "awx"
    expected_status: true

final_summary:
  source: "jenkins"
  path: "artifacts/summary/lab6_summary.json"
  statuses:
    success: "SUCCESS"
    failure: "FAILURE"
    skipped: "SKIPPED"
