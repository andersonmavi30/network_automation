  hosts: localhost
  gather_facts: false

  tasks:
    - name: Run Nornir collection
      ansible.builtin.command:
        cmd: /opt/automation/venv/bin/python shared/scripts/collect_lab2_nornir.py
        chdir: /home/andersonmavi30/netauto-labs

    - name: Run Genie validation
      ansible.builtin.command:
        cmd: /opt/automation/venv/bin/python shared/scripts/validate_lab2_genie.py
        chdir: /home/andersonmavi30/netauto-labs